[project]
name = "zero-harness"
version = "0.1.0"
description = "A minimal terminal coding agent"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Devin Jones", email = "123031139+devinjones812@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.10.0",
    "openai>=3.52.0",
    "parallel-web>=1.3.7",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.4",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "ripgrep>=15.1.0",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
zero = "zero_harness.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
